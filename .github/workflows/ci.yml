name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test with coverage
        if: matrix.node-version == 22
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify third-party notices
        run: npm run notices:check

      - name: Verify reproducible embedded assets
        if: matrix.node-version == 22
        run: |
          node ../scripts/sync-embedded-ui.mjs
          git diff --exit-code -- ../server/internal/embed/dist ../THIRD_PARTY_NOTICES.md

      - name: Audit dependencies
        run: npm audit --audit-level=high

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.24.x'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

      - name: Build
        run: go build ./...

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Build release image
        run: docker build -t ojs-playground:ci -f server/Dockerfile .
      - name: Verify license texts in image
        run: |
          NOTICE_EXPECTED=$(sha256sum THIRD_PARTY_NOTICES.md | cut -d' ' -f1)
          NOTICE_ACTUAL=$(docker run --rm --entrypoint sha256sum ojs-playground:ci /licenses/THIRD_PARTY_NOTICES.md | cut -d' ' -f1)
          LICENSE_EXPECTED=$(sha256sum LICENSE | cut -d' ' -f1)
          LICENSE_ACTUAL=$(docker run --rm --entrypoint sha256sum ojs-playground:ci /licenses/LICENSE | cut -d' ' -f1)
          test "$NOTICE_ACTUAL" = "$NOTICE_EXPECTED"
          test "$LICENSE_ACTUAL" = "$LICENSE_EXPECTED"

  npm-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.24.x'
      - name: Verify release calculation
        run: node ../scripts/check-release-please.mjs
      - name: Verify CLI package dry run
        run: |
          npm test
          node ../scripts/build-release-assets.mjs
          OJS_RELEASE_ASSETS=../release-assets npm run check:package
