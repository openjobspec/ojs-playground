<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OJS Playground</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f6f8fa;
    --border: #d0d7de;
    --text: #1f2328;
    --text-muted: #656d76;
    --accent: #0969da;
    --accent-hover: #0550ae;
    --success: #1a7f37;
    --error: #cf222e;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  [data-theme="dark"] {
    --bg: #0d1117;
    --bg-secondary: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --success: #3fb950;
    --error: #f85149;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 8px;
    gap: 6px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .header-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .header-title a {
    color: var(--accent);
    text-decoration: none;
  }

  .editor-area {
    flex: 1;
    min-height: 0;
  }

  textarea {
    width: 100%;
    height: 100%;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.5;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-secondary);
    color: var(--text);
    resize: none;
    outline: none;
    tab-size: 2;
  }

  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.15);
  }

  .actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }

  button {
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transition: background 0.15s;
  }

  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    font-size: 11px;
    color: var(--text-muted);
    flex: 1;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .status.success { color: var(--success); }
  .status.error { color: var(--error); }

  .response-area {
    flex-shrink: 0;
    max-height: 40%;
    overflow: auto;
  }

  .response {
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.4;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-secondary);
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="header-title">OJS Playground &middot; <a href="https://openjobspec.org" target="_blank" rel="noopener">openjobspec.org</a></span>
  </div>

  <div class="editor-area">
    <textarea id="input" spellcheck="false">{
  "type": "email.welcome",
  "args": ["user@example.com"],
  "queue": "default",
  "priority": 1
}</textarea>
  </div>

  <div class="actions">
    <button id="enqueue" type="button">Enqueue</button>
    <span id="status" class="status"></span>
  </div>

  <div id="response-area" class="response-area" style="display:none">
    <pre id="response" class="response"></pre>
  </div>
</div>

<script>
(function () {
  "use strict";

  var params = new URLSearchParams(window.location.search);
  var apiUrl = params.get("url") || "http://localhost:8080";
  var theme = params.get("theme") || "light";

  if (theme === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }

  var input = document.getElementById("input");
  var enqueueBtn = document.getElementById("enqueue");
  var statusEl = document.getElementById("status");
  var responseArea = document.getElementById("response-area");
  var responseEl = document.getElementById("response");

  function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = "status" + (type ? " " + type : "");
  }

  function notifyParent() {
    if (window.parent !== window) {
      var height = document.documentElement.scrollHeight;
      window.parent.postMessage({ type: "ojs-playground-resize", height: height }, "*");
    }
  }

  enqueueBtn.addEventListener("click", function () {
    var body;
    try {
      body = JSON.parse(input.value);
    } catch (e) {
      setStatus("Invalid JSON: " + e.message, "error");
      return;
    }

    enqueueBtn.disabled = true;
    setStatus("Sending…");

    var endpoint = apiUrl.replace(/\/+$/, "") + "/jobs";

    fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })
      .then(function (res) {
        return res.text().then(function (text) {
          return { status: res.status, ok: res.ok, body: text };
        });
      })
      .then(function (result) {
        if (result.ok) {
          setStatus("✓ " + result.status + " OK", "success");
        } else {
          setStatus("✗ " + result.status, "error");
        }
        try {
          responseEl.textContent = JSON.stringify(JSON.parse(result.body), null, 2);
        } catch (_) {
          responseEl.textContent = result.body;
        }
        responseArea.style.display = "block";
        notifyParent();
      })
      .catch(function (err) {
        setStatus("Network error: " + err.message, "error");
        responseEl.textContent = err.message;
        responseArea.style.display = "block";
        notifyParent();
      })
      .finally(function () {
        enqueueBtn.disabled = false;
      });
  });

  // Allow Cmd/Ctrl+Enter to enqueue
  input.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      enqueueBtn.click();
    }
  });

  // Tab key inserts two spaces
  input.addEventListener("keydown", function (e) {
    if (e.key === "Tab") {
      e.preventDefault();
      var start = input.selectionStart;
      var end = input.selectionEnd;
      input.value = input.value.substring(0, start) + "  " + input.value.substring(end);
      input.selectionStart = input.selectionEnd = start + 2;
    }
  });
})();
</script>
</body>
</html>
